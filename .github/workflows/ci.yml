name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest --tb=short -q

      - name: Check OG metadata sync
        run: python scripts/internal/check-og-metadata.py

      - name: Verify GitHub Pages assets
        run: |
          test -f docs/index.html || (echo "ERROR: docs/index.html missing" && exit 1)
          test -s docs/index.html || (echo "ERROR: docs/index.html is empty" && exit 1)
          test -f docs/404.html   || (echo "ERROR: docs/404.html missing" && exit 1)
          test -s docs/404.html   || (echo "ERROR: docs/404.html is empty" && exit 1)
          test -f docs/favicons/og-local.png || (echo "ERROR: docs/favicons/og-local.png missing" && exit 1)
          test -s docs/favicons/og-local.png || (echo "ERROR: docs/favicons/og-local.png is empty" && exit 1)
          echo "GitHub Pages assets: OK"
